<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Tracker install flow</title>
  <desc id="desc">Step-by-step tracker build flow from USB flash through app adoption and OTA recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111"/>
    </marker>
    <style>
      .bg{fill:#fff}
      .step{fill:#f7f7f7;stroke:#111;stroke-width:2}
      .title{font:26px sans-serif;font-weight:700;fill:#111}
      .text{font:18px sans-serif;fill:#111}
      .small{font:15px sans-serif;fill:#333}
      .num{font:24px sans-serif;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
      .dot{fill:#111}
      .line{stroke:#111;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1200" height="560"/>
  <text x="54" y="58" class="title">Build and deploy one tracker</text>
  <g transform="translate(54 125)">
    <rect class="step" width="178" height="150" rx="8"/>
    <circle class="dot" cx="32" cy="34" r="18"/><text class="num" x="32" y="34">1</text>
    <text class="title" x="62" y="42">Flash</text>
    <text class="text" x="24" y="84">Run script over USB</text>
    <text class="small" x="24" y="116">./flash_new_tracker.sh</text>
  </g>
  <path class="line" d="M232 200 H285"/>
  <g transform="translate(285 125)">
    <rect class="step" width="178" height="150" rx="8"/>
    <circle class="dot" cx="32" cy="34" r="18"/><text class="num" x="32" y="34">2</text>
    <text class="title" x="62" y="42">Label</text>
    <text class="text" x="24" y="84">Write tracker ID</text>
    <text class="small" x="24" y="116">tracker-xxxxxx</text>
  </g>
  <path class="line" d="M463 200 H516"/>
  <g transform="translate(516 125)">
    <rect class="step" width="178" height="150" rx="8"/>
    <circle class="dot" cx="32" cy="34" r="18"/><text class="num" x="32" y="34">3</text>
    <text class="title" x="62" y="42">Install</text>
    <text class="text" x="24" y="84">Power, SIM, antennas</text>
    <text class="small" x="24" y="116">CAN optional</text>
  </g>
  <path class="line" d="M694 200 H747"/>
  <g transform="translate(747 125)">
    <rect class="step" width="178" height="150" rx="8"/>
    <circle class="dot" cx="32" cy="34" r="18"/><text class="num" x="32" y="34">4</text>
    <text class="title" x="62" y="42">Adopt</text>
    <text class="text" x="24" y="84">Add Device in app</text>
    <text class="small" x="24" y="116">assign vehicle</text>
  </g>
  <path class="line" d="M925 200 H978"/>
  <g transform="translate(978 125)">
    <rect class="step" width="178" height="150" rx="8"/>
    <circle class="dot" cx="32" cy="34" r="18"/><text class="num" x="32" y="34">5</text>
    <text class="title" x="62" y="42">Verify</text>
    <text class="text" x="24" y="84">Check dashboard map</text>
    <text class="small" x="24" y="116">then install is done</text>
  </g>
  <rect x="285" y="365" width="640" height="105" rx="8" class="step"/>
  <text x="320" y="410" class="title">Recovery path</text>
  <text x="320" y="446" class="text">Build a microSD card with ./make_sd_card.sh, insert it, and power-cycle the tracker.</text>
</svg>
