# Shared settings across all boards
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
  vshymanskyy/TinyGSM@^0.12.0
  bblanchon/ArduinoJson@^7.3.1
build_flags =
  -D TINY_GSM_MODEM_SIM7000SSL
  -D TINY_GSM_RX_BUFFER=2048

# tracker-002 — existing board with hardcoded credentials
[env:lilygo_t_sim7000g]
upload_port = /dev/cu.usbserial-59680313751
monitor_port = /dev/cu.usbserial-59680313751
build_flags =
  ${env.build_flags}
  -D TRACKER_DEVICE_ID='"tracker-002"'
  -D TRACKER_API_KEY='"c5cc56a23546eb487223fe810ae8a8b76d83376ee09140f7"'

# tracker-003 — third board
[env:lilygo_t_sim7000g_3]
upload_port = /dev/cu.usbserial-59680316621
monitor_port = /dev/cu.usbserial-59680316621
build_flags =
  ${env.build_flags}
  -D TRACKER_DEVICE_ID='"tracker-003"'
  -D TRACKER_API_KEY='"c5cc56a23546eb487223fe810ae8a8b76d83376ee09140f7"'

# tracker-001 — second board with hardcoded credentials
[env:lilygo_t_sim7000g_2]
upload_port = /dev/cu.usbserial-59680319341
monitor_port = /dev/cu.usbserial-59680319341
build_flags =
  ${env.build_flags}
  -D TRACKER_DEVICE_ID='"tracker-001"'
  -D TRACKER_API_KEY='"c5cc56a23546eb487223fe810ae8a8b76d83376ee09140f7"'

# tracker-001 BENCH build — 1NCE OS UDP transport trial (v0.10.0). Telemetry goes as
# plain UDP datagrams to udp.os.1nce.com:4445; 1NCE webhooks them to the server. Full
# HTTPS heartbeat every 15 min for assured delivery + OTA. USB-flash only — do NOT
# upload this build to the OTA store while it's a single-board trial.
[env:bench_nce_udp]
upload_port = /dev/cu.usbserial-59680319341
monitor_port = /dev/cu.usbserial-59680319341
build_flags =
  ${env.build_flags}
  -D TRACKER_DEVICE_ID='"tracker-001"'
  -D TRACKER_API_KEY='"c5cc56a23546eb487223fe810ae8a8b76d83376ee09140f7"'
  -D TRACKER_USE_NCE_UDP=1

# FACTORY image — the one generic build every new board gets (flash_new_tracker.sh).
# No device ID baked in: on first boot the board names itself
# tracker-<last 6 hex of efuse MAC>, saves that to NVS, and advertises over BLE
# until it's adopted in the app (Devices → Add Device). No upload_port pinned —
# the flash script passes whichever USB port the new board enumerated on.
[env:factory]
build_flags =
  ${env.build_flags}
  -D TRACKER_DEVICE_ID='"unprovisioned"'
